name: vps_admin
description: "VPS Admin: administer your servers from your phone."
publish_to: 'none'

# CI overrides the build number (see .github/workflows/release.yml).
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  dynamic_color: 1.9.0 # 2.x is built on material_ui, incompatible with flutter/material.dart
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.6
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Google Sans Flex (OFL), the panel's font, as static weights (tools/gen-app-fonts.py)
  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-400.ttf
          weight: 400
        - asset: assets/fonts/GoogleSansFlex-500.ttf
          weight: 500
        - asset: assets/fonts/GoogleSansFlex-600.ttf
          weight: 600
        - asset: assets/fonts/GoogleSansFlex-700.ttf
          weight: 700
    - family: GoogleSansFlexExt
      fonts:
        - asset: assets/fonts/GoogleSansFlexExt-400.ttf
          weight: 400
        - asset: assets/fonts/GoogleSansFlexExt-500.ttf
          weight: 500
        - asset: assets/fonts/GoogleSansFlexExt-600.ttf
          weight: 600
        - asset: assets/fonts/GoogleSansFlexExt-700.ttf
          weight: 700
