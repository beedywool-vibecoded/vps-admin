name: vps_admin
description: "VPS Admin: administer your servers from your phone."
publish_to: 'none'

# CI overrides the build number (see .github/workflows/release.yml).
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  dynamic_color: 1.9.0 # 2.x is built on material_ui, incompatible with flutter/material.dart
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.6
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
