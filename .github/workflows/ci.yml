name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A commit records the people who made the change. The helper that wrote a patch gets
      # no trailer, so the log stays a record of who is accountable for the code.
      - name: No AI co-author trailers
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE..$AFTER"
          elif git rev-parse --quiet --verify "${BEFORE:-none}^{commit}" >/dev/null 2>&1; then
            range="$BEFORE..$AFTER"
          else
            range="$AFTER"
          fi
          bad=""
          for c in $(git rev-list "$range"); do
            msg=$(git log -1 --format='%B' "$c")
            if printf '%s\n' "$msg" | grep -qiE \
              '^Co-Authored-By:.*(codebuff|copilot|cursor|windsurf|aider|devin|chatgpt|anthropic|openai|claude code|gemini-cli)|^Generated with (codebuff|claude|copilot|cursor|aider|windsurf|devin|chatgpt)'
            then
              bad="$bad$c $(git log -1 --format='%s' "$c")\n"
            fi
          done
          if [ -n "$bad" ]; then
            printf "%b" "$bad"
            echo "::error::These commits credit an AI tool in their message. Drop the trailer and the 'Generated with' line: git rebase -i <base> with reword, or commit --amend for the last one."
            exit 1
          fi
          echo "No AI co-author trailers in ${range}."

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - run: bash -n deploy/install.sh && sh -n deploy/preflight.sh && sh -n deploy/run-script.sh && sh -n deploy/proxy-helper.sh && sh -n deploy/storage-helper.sh

      - name: Installer and agent share the release key
        run: |
          key=$(sed -n 's/.*PublicKey = "\(.*\)"/\1/p' internal/update/pubkey.go)
          grep -q "PUBLIC_KEY=\"$key\"" deploy/install.sh

      - name: No em dash anywhere
        run: "! git grep -nP '\\x{2014}' -- . ':!*.lock'"
