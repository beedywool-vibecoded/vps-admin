name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - run: bash -n deploy/install.sh && sh -n deploy/preflight.sh && sh -n deploy/run-script.sh

      - name: Installer and agent share the release key
        run: |
          key=$(sed -n 's/.*PublicKey = "\(.*\)"/\1/p' internal/update/pubkey.go)
          grep -q "PUBLIC_KEY=\"$key\"" deploy/install.sh

      - name: No em dash anywhere
        run: "! git grep -nP '\\x{2014}' -- . ':!*.lock'"
