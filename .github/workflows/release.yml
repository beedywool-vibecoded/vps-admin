# Push a tag like v1.2.3 to publish a release. Every agent with auto-update on installs
# it within 6 hours; the binaries are only trusted if SHA256SUMS.sig verifies against the
# public key compiled into the agent.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        if: hashFiles('web/package.json') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the panel
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci && npm run build

      - run: go test ./...

      - name: Build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/beedywool/vps-admin/internal/buildinfo.Version=$GITHUB_REF_NAME -X github.com/beedywool/vps-admin/internal/buildinfo.Repo=$GITHUB_REPOSITORY" \
              -o dist/vps-admin_linux_$arch ./cmd/vps-admin
          done
          cp deploy/install.sh deploy/preflight.sh deploy/run-script.sh deploy/proxy-helper.sh deploy/vps-admin.service dist/
          cd dist && sha256sum vps-admin_linux_* > SHA256SUMS

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      # The Android app ships with every release; agents serve it to paired phones.
      - name: Build the app
        working-directory: app
        env:
          KEYSTORE_B64: ${{ secrets.VPSADMIN_KEYSTORE_B64 }}
          VPSADMIN_KEYSTORE_PASSWORD: ${{ secrets.VPSADMIN_KEYSTORE_PASSWORD }}
          VPSADMIN_KEY_PASSWORD: ${{ secrets.VPSADMIN_KEYSTORE_PASSWORD }}
          VPSADMIN_KEY_ALIAS: vpsadmin
        run: |
          test -n "$KEYSTORE_B64" || { echo "VPSADMIN_KEYSTORE_B64 secret missing"; exit 1; }
          export VPSADMIN_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$VPSADMIN_KEYSTORE"
          flutter pub get
          flutter analyze
          flutter test
          name="${GITHUB_REF_NAME#v}"
          code=$((GITHUB_RUN_NUMBER + 100))
          flutter build apk --release --target-platform android-arm64 --build-name "$name" --build-number "$code"
          rm "$VPSADMIN_KEYSTORE"
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/vps-admin.apk
          jq -n --argjson code "$code" --arg name "$name" \
            --arg sha "$(sha256sum ../dist/vps-admin.apk | cut -d' ' -f1)" \
            --argjson size "$(stat -c %s ../dist/vps-admin.apk)" \
            '{versionCode: $code, versionName: $name, sha256: $sha, size: $size}' > ../dist/vps-admin-apk.json
          cat ../dist/vps-admin-apk.json

      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY" || { echo "RELEASE_SIGNING_KEY secret missing"; exit 1; }
          go run ./tools/release-sign dist/SHA256SUMS > dist/SHA256SUMS.sig

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            git log --no-merges --format='- %s' "$prev..$GITHUB_REF_NAME" > notes.md
          else
            echo "First release." > notes.md
          fi
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          # A release for the tag may already exist: a draft written on GitHub is published when
          # its tag is pushed, and a re-run finds the release from a previous attempt. Fill it
          # instead of failing the build with "already_exists".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $flags --draft=false
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md $flags
          fi
